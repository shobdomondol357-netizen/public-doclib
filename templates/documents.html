{% extends "base.html" %}
{% block content %}
<h1>Documents</h1>
<form action="/documents" method="get" class="searchbar">
  <input type="text" name="q" value="{{ q }}" placeholder="Search..." />
  <select name="category">
    <option value="">All categories</option>
    {% for c in categories %}
      <option value="{{ c.slug }}" {% if c.slug==category %}selected{% endif %}>{{ c.name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Filter</button>
</form>
<div class="list">
{% for d in docs %}
  <a class="row" href="/documents/{{ d.id }}">
    <strong>{{ d.title }}</strong>
    <span class="meta">{{ d.file_ext or '' }} &middot; {{ d.text_status }} &middot; {{ d.size_bytes }} bytes</span>
  </a>
{% else %}
  <p>No documents found.</p>
{% endfor %}
</div>
{% endblock %}
